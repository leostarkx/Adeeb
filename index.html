
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام إدارة المؤسسات التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #2563eb;
        --bg-main: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --shadow-color: rgba(0, 0, 0, 0.05);
        --input-bg: #ffffff;
      }

      [data-theme='midnight'] {
        --shadow-color: rgba(0, 0, 0, 0.4);
        --input-bg: #1e293b;
      }

      body {
        font-family: 'Tajawal', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        transition: background-color 0.4s ease, color 0.4s ease;
        overflow-x: hidden;
      }
      
      /* التصحيح اللوني الشامل للعناصر */
      .bg-white { background-color: var(--card-bg) !important; }
      .text-slate-900, .text-slate-800, .text-gray-800 { color: var(--text-main) !important; }
      .text-slate-400, .text-slate-500, .text-gray-400, .text-gray-500 { color: var(--text-muted) !important; }
      .border-gray-50, .border-gray-100, .border-slate-100, .border-slate-50 { border-color: var(--border-color) !important; }
      
      .bg-blue-600 { background-color: var(--primary) !important; }
      .text-blue-600, .text-blue-700 { color: var(--primary) !important; }
      
      /* تخصيص الثيم الليلي بشكل دقيق */
      [data-theme='midnight'] aside, 
      [data-theme='midnight'] header,
      [data-theme='midnight'] .bg-slate-50,
      [data-theme='midnight'] .bg-gray-50 {
        background-color: color-mix(in srgb, var(--card-bg), transparent 30%) !important;
        border-color: var(--border-color) !important;
      }

      [data-theme='midnight'] input, 
      [data-theme='midnight'] select, 
      [data-theme='midnight'] textarea {
        background-color: var(--input-bg) !important;
        color: #f8fafc !important;
        border-color: var(--border-color) !important;
      }

      [data-theme='midnight'] .bg-blue-50 { background-color: rgba(56, 189, 248, 0.1) !important; color: #7dd3fc !important; }
      [data-theme='midnight'] .bg-emerald-50 { background-color: rgba(52, 211, 153, 0.1) !important; color: #6ee7b7 !important; }
      [data-theme='midnight'] .bg-amber-50 { background-color: rgba(251, 191, 36, 0.1) !important; color: #fcd34d !important; }
      [data-theme='midnight'] .bg-red-50 { background-color: rgba(248, 113, 113, 0.1) !important; color: #fca5a5 !important; }

      /* البطاقات والظلال */
      .card-shadow {
        box-shadow: 0 10px 25px -5px var(--shadow-color);
      }

      .custom-scrollbar::-webkit-scrollbar { width: 8px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 20px;
        border: 2px solid var(--bg-main);
      }

      .animate-in { 
        animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      @keyframes slideIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media print {
        .no-print { display: none !important; }
        body, html, #root { background: white !important; color: black !important; }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react/": "https://esm.sh/react@19.0.0/",
        "react-dom": "https://esm.sh/react-dom@19.0.0",
        "react-dom/": "https://esm.sh/react-dom@19.0.0/",
        "lucide-react": "https://esm.sh/lucide-react@0.468.0?external=react",
        "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
